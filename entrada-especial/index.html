<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4fa" />
    <meta name="description" content="Uma surpresa em forma de história." />
    <title>Uma história só nossa</title>
    <link rel="stylesheet" href="entry.css" />
  </head>
  <body>
    <main class="entry-screen" id="entry-screen">
      <div class="entry-content">
        <header class="entry-intro">
          <p class="eyebrow">uma surpresa para você</p>
          <h1>uma história<br />só nossa</h1>
          <p class="intro-copy">Antes de continuar, responda uma coisinha que só nós dois sabemos.</p>
        </header>

        <section class="date-card" aria-labelledby="date-title">
          <div class="card-content">
            <p class="card-kicker">nosso começo</p>
            <h2 id="date-title">Qual é a data especial?</h2>
            <p class="date-hint">DD / MM / AAAA</p>

            <div class="date-display" aria-label="Nenhuma data digitada" aria-live="polite">
              <span class="heart-mark" aria-hidden="true">♥</span>
              <div class="date-slots" id="date-slots"></div>
            </div>
            <p class="status" id="status" role="status">Digite a data para abrir a surpresa.</p>

            <div class="keypad" aria-label="Teclado numérico">
              <button class="key" type="button" data-key="1">1</button>
              <button class="key" type="button" data-key="2">2</button>
              <button class="key" type="button" data-key="3">3</button>
              <button class="key" type="button" data-key="4">4</button>
              <button class="key" type="button" data-key="5">5</button>
              <button class="key" type="button" data-key="6">6</button>
              <button class="key" type="button" data-key="7">7</button>
              <button class="key" type="button" data-key="8">8</button>
              <button class="key" type="button" data-key="9">9</button>
              <span class="key-spacer" aria-hidden="true"></span>
              <button class="key" type="button" data-key="0">0</button>
              <button class="key key-backspace" type="button" data-action="backspace" aria-label="Apagar último número">⌫</button>
            </div>
          </div>
        </section>

        <div class="continue-area" id="continue-area" aria-hidden="true">
          <button class="continue-button" id="open-book" type="button">
            abrir nossa história <span aria-hidden="true">↓</span>
          </button>
        </div>

        <p class="entry-footnote">toque nos números ou use o teclado do celular</p>
      </div>
    </main>

    <div class="success-toast" id="success-toast" role="alert" aria-hidden="true">
      <span aria-hidden="true">💌</span>
      <span>Data confirmada!</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
